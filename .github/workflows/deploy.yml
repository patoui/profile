name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read    # needed to checkout the repo
      packages: write   # needed to push the image to GHCR

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Emit Prisma contract
        run: pnpm run contract:emit

      - name: Run unit tests
        run: pnpm run test:run:unit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout homelab repository
        uses: actions/checkout@v5
        with:
          repository: patoui/homelab
          token: ${{ secrets.HOMELAB_TOKEN }}
          path: homelab

      - name: Update homelab image reference
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          deployment_file=homelab/apps/patriqueouimet/deployment.yaml
          image="ghcr.io/patoui/profile:${IMAGE_TAG}"

          grep -Eq "ghcr\\.io/patoui/profile:[^[:space:]\\\"']+" "$deployment_file"
          sed -i -E "s#ghcr\.io/patoui/profile:[^[:space:]\"']+#${image}#" "$deployment_file"

          if git -C homelab diff --quiet -- apps/patriqueouimet/deployment.yaml; then
            echo "Homelab is already configured for ${image}."
            exit 0
          fi

          git -C homelab config user.name "github-actions[bot]"
          git -C homelab config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homelab add apps/patriqueouimet/deployment.yaml
          git -C homelab commit -m "chore: update profile image to ${IMAGE_TAG}"
          git -C homelab push origin HEAD
